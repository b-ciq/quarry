name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,ui]"
      - run: pytest -q
      - run: quarry validate
      - run: quarry validate --check-stale
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm test --prefix ui
      - run: npm run build --prefix ui
      - name: Committed UI build is up to date
        run: |
          git diff --exit-code -- src/quarry/ui/static
          test -z "$(git status --porcelain -- src/quarry/ui/static)" || { git status --porcelain -- src/quarry/ui/static; echo "src/quarry/ui/static is stale: rebuild and commit"; exit 1; }
