[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quarry"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
quarry = "quarry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
